<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ігри та завдання — Easy Peasy English</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#4a1f8f;--black:#17121f;--soft:#6b4aa8;--pop:#a66bff;--pale:#f3ecff}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--black);font-family:"Nunito",system-ui,sans-serif;line-height:1.55;padding:28px 20px 56px}
main{max-width:760px;margin:0 auto}
a{color:inherit}
.back{display:inline-block;color:var(--ink);text-decoration:none;font-weight:700;margin-bottom:10px}
h1{font-size:2.3rem;line-height:1.1;margin:0 0 6px;font-weight:900;color:var(--ink)}
.sub{color:var(--soft);margin:0 0 26px}
.tiles{display:grid;gap:18px;grid-template-columns:1fr 1fr}
@media (max-width:520px){.tiles{grid-template-columns:1fr}}
.tile{display:block;padding:26px 22px;border:2px solid var(--black);border-radius:16px;box-shadow:6px 6px 0 var(--pop);text-decoration:none;background:#fff}
.tile b{display:block;font-size:1.5rem;color:var(--ink);font-weight:900}
.tile span{color:var(--soft)}
.tile:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--pop)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 26px}
.chip{padding:9px 18px;border:2px solid var(--black);border-radius:999px;font-weight:700;text-decoration:none;background:#fff}
.chip:hover{background:var(--pale)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.list{display:grid;gap:12px}
.game{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px;border:2px solid var(--black);border-radius:14px;text-decoration:none;background:#fff;box-shadow:4px 4px 0 var(--pale)}
.game:hover{box-shadow:4px 4px 0 var(--pop)}
.game b{display:block;color:var(--ink)}
.game span{font-size:.9rem;color:var(--soft)}
.tag{flex:none;font-weight:700;font-size:.9rem;padding:4px 12px;border-radius:999px;background:var(--pale);color:var(--ink)}
.tag.free{background:var(--ink);color:#fff}
.empty{padding:18px;border:2px dashed var(--pop);border-radius:14px;color:var(--soft)}
a:focus-visible{outline:3px solid var(--pop);outline-offset:3px}
@media (prefers-reduced-motion:no-preference){.tile{transition:transform .12s,box-shadow .12s}}
</style>
</head>
<body>
<main id="app"></main>

<script>
/* ДОДАВАЙТЕ ІГРИ СЮДИ. Один рядок = одна гра. Приклад рядка наведено нижче:
   cat: "grammar" або "vocab"
   level: "pre-a1", "a1", "a2", "b1" або "b2"
   title: назва гри; note: короткий опис
   url: безкоштовна гра = папка (наприклад "present-simple-a2/"); платна = посилання WayForPay
   free: true або false; price: "99 грн" (тільки для платних)

   Скопіюйте цей рядок між дужками [ ] нижче й змініть дані:
   { cat:"grammar", level:"a2", title:"Present Simple", note:"Пробна гра", url:"present-simple-a2/", free:true },
*/
var GAMES = [

];

var CATS = { grammar:{name:"Граматика", hint:"Часи, структури, правила"}, vocab:{name:"Vocabulary", hint:"Слова за темами"} };
var LEVELS = [["pre-a1","Pre-A1"],["a1","A1"],["a2","A2"],["b1","B1"],["b2","B2"]];
var app = document.getElementById("app");

function levelName(id){ for(var i=0;i<LEVELS.length;i++){ if(LEVELS[i][0]===id) return LEVELS[i][1]; } return id; }

function render(){
  var p = location.hash.slice(1).split("/"), cat = p[0], lvl = p[1], h = "";
  if(!CATS[cat]){
    h += '<a class="back" href="index.html">‹ Easy Peasy English</a>';
    h += '<h1>Ігри та завдання</h1><p class="sub">Оберіть розділ.</p><div class="tiles">';
    for(var k in CATS){ h += '<a class="tile" href="#'+k+'"><b>'+CATS[k].name+'</b><span>'+CATS[k].hint+'</span></a>'; }
    h += '</div>';
  } else {
    h += '<a class="back" href="#">‹ Усі розділи</a>';
    h += '<h1>'+CATS[cat].name+'</h1><p class="sub">Оберіть свій рівень.</p><div class="chips">';
    LEVELS.forEach(function(l){ h += '<a class="chip'+(lvl===l[0]?' on':'')+'" href="#'+cat+'/'+l[0]+'">'+l[1]+'</a>'; });
    h += '</div>';
    if(lvl){
      var items = GAMES.filter(function(g){ return g.cat===cat && g.level===lvl; });
      if(!items.length){ h += '<p class="empty">Тут скоро з’являться ігри для рівня '+levelName(lvl)+'.</p>'; }
      else {
        h += '<div class="list">';
        items.forEach(function(g){
          h += '<a class="game" href="'+g.url+'"><div><b>'+g.title+'</b><span>'+g.note+'</span></div><div class="tag'+(g.free?' free">Безкоштовно':'">'+g.price)+'</div></a>';
        });
        h += '</div>';
      }
    }
  }
  app.innerHTML = h;
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
