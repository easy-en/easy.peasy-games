<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Present Simple Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#3B4BD8;--bg2:#7A4DE8;--ink:#1B1F4B;--card:#fff;--soft:#EEF1FF;--line:#D3D9F7;--s:#1C7ED6;--a:#E67700;--v:#2B8A3E;--x:#E03131;--ok:#2B8A3E;--okbg:#DFF7E4;--no:#6741D9;--nobg:#EDE7FF;--gold:#FFC53D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#222a9c;--bg2:#52299f}}
:root[data-theme="dark"]{--bg1:#222a9c;--bg2:#52299f}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;font-family:'Fredoka','Trebuchet MS','Comic Sans MS',system-ui,sans-serif;font-size:20px;color:var(--ink);background:#4B47DD;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%}
header.top{display:flex;align-items:center;gap:12px;padding:10px 16px;color:#fff;flex-wrap:wrap}
.ib{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:16px;min-width:46px;height:46px;font-size:22px;padding:0 12px}
.ib:hover{background:rgba(255,255,255,.3)}
.prog{flex:1;min-width:150px}
.prog small{display:block;font-size:15px;opacity:.9;margin-bottom:4px}
.bar{height:12px;border-radius:8px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:8px;transition:width .3s}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.2);border-radius:14px;padding:4px 10px;font-size:16px;white-space:nowrap}
.chip.me{background:var(--gold);color:var(--ink);font-weight:600}
main#stage{flex:1;overflow:auto;padding:6px 16px 16px;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border-radius:30px;padding:26px 30px;box-shadow:0 10px 0 rgba(20,20,80,.28);max-width:1180px;margin:0 auto}
.two{display:grid;grid-template-columns:1.05fr 1fr;gap:26px;align-items:stretch}
@media (max-width:860px){.two{grid-template-columns:1fr}.card{padding:18px}}
h1{font-size:46px;line-height:1.1;margin:0 0 10px}
h2{font-size:34px;line-height:1.15;margin:0 0 12px}
h3{font-size:24px;margin:0 0 8px}
p{margin:8px 0;line-height:1.35}
.sub{opacity:.75;font-size:18px}
.w-s{color:var(--s)}.w-a{color:var(--a)}.w-v{color:var(--v)}.w-x{color:var(--x);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}.w-o{color:var(--ink)}
b{font-weight:600}
.formula{background:var(--soft);border:3px dashed var(--line);border-radius:22px;padding:14px 18px;font-size:30px;font-weight:600;margin:10px 0;line-height:1.5}
.formula.two2{display:grid;gap:8px}
.rule{font-size:22px}
.ex{list-style:none;padding:0;margin:10px 0}
.ex li{font-size:32px;font-weight:500;margin:8px 0;display:flex;align-items:center;gap:10px}
.spk{border:0;background:var(--soft);border-radius:50%;width:42px;height:42px;font-size:20px;flex:none}
.instr{margin-top:12px;background:#FFF3BF;border-radius:18px;padding:10px 16px;font-size:21px}
.note{margin-top:10px;background:var(--nobg);border-radius:16px;padding:8px 14px;font-size:17px}
.morph{display:grid;gap:6px;margin:10px 0;font-size:32px}
.morph div{background:var(--soft);border-radius:18px;padding:8px 16px}
.morph .arr{background:none;text-align:center;font-size:26px;padding:0}
.morph s{color:var(--x);text-decoration-thickness:4px}
table.tb{border-collapse:separate;border-spacing:6px;font-size:28px;margin:8px 0}
table.tb td{background:var(--soft);border-radius:14px;padding:6px 14px}
.scene{position:relative;background:radial-gradient(circle at 50% 35%,#FFF7D6,#CFE3FF 75%);border-radius:26px;min-height:320px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px;overflow:hidden}
.chars{display:flex;align-items:flex-end;justify-content:center;gap:4px;min-height:130px}
.ring{display:flex;gap:0;border:4px dashed var(--s);border-radius:60px;padding:6px 16px;background:rgba(255,255,255,.5)}
.big{font-size:84px;line-height:1;position:relative;white-space:nowrap}
.big .over{position:absolute;right:-30px;top:-14px;font-size:58px;font-style:normal}
.bubble{background:#fff;border:4px solid var(--ink);border-radius:26px;padding:8px 18px;font-size:28px;font-weight:600;position:relative;max-width:100%;text-align:center}
.cap{font-size:20px;font-weight:600}
.kid{display:block}
.opt{display:block;width:100%;font-size:28px;font-weight:500;text-align:left;padding:14px 20px;margin:10px 0;border-radius:20px;border:4px solid var(--line);background:#fff;transition:transform .08s}
.opt:hover:not(:disabled){border-color:var(--s);transform:translateY(-2px)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:#14532d}
.opt.soft{background:var(--nobg);border-color:var(--no);color:#3b2a8c}
.opt:disabled{cursor:default}
.row{padding:12px 0;border-bottom:3px dotted var(--line)}
.row:last-child{border:0}
.row .prompt{font-size:28px;font-weight:500;margin-bottom:6px}
.row .inl{display:flex;gap:10px;flex-wrap:wrap}
.row .opt{width:auto;display:inline-block;margin:4px 0;font-size:24px;padding:10px 18px}
.blank{display:inline-block;min-width:80px;border-bottom:5px solid var(--ink);text-align:center;color:var(--no)}
.bad{color:var(--no);text-decoration:line-through;text-decoration-color:var(--x);text-decoration-thickness:3px}
.fb{margin:8px 0;padding:10px 16px;border-radius:18px;font-size:22px}
.fb.ok{background:var(--okbg);color:#14532d}
.fb.no{background:var(--nobg);color:#3b2a8c}
.fb.hint{background:#FFF3BF}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.btn{border:0;border-radius:18px;padding:10px 20px;font-size:22px;font-weight:600;background:var(--soft);color:var(--ink);box-shadow:0 5px 0 rgba(20,20,80,.18)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(20,20,80,.18)}
.btn.pri{background:var(--gold)}
.btn.go{background:var(--ok);color:#fff}
.btn.big2{font-size:30px;padding:14px 34px}
.btn:disabled{opacity:.45;cursor:default}
footer.nav{display:flex;align-items:center;gap:12px;padding:10px 16px;justify-content:space-between;flex-wrap:wrap}
footer.nav .btn{min-width:130px}
.turn{display:flex;align-items:center;gap:6px;color:#fff;font-size:17px;flex-wrap:wrap;justify-content:center}
.turn button{border:0;border-radius:14px;padding:6px 12px;background:rgba(255,255,255,.2);color:#fff;font-size:17px}
.turn button.on{background:var(--gold);color:var(--ink);font-weight:600}
.slots{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;align-items:center;font-size:30px}
.slot{min-width:110px;min-height:62px;border:4px dashed var(--line);border-radius:18px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:28px;padding:0 10px}
.slot.f{border-style:solid;border-color:var(--s);background:#fff;cursor:pointer}
.slot.ok{border-color:var(--ok);background:var(--okbg)}
.tray{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.wc{border:4px solid var(--line);background:#fff;border-radius:18px;padding:10px 18px;font-size:28px;font-weight:600;box-shadow:0 5px 0 rgba(20,20,80,.15)}
.wc.used{visibility:hidden}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 36px;margin:10px 0}
.mi{border:4px solid var(--line);border-radius:20px;background:#fff;padding:8px 14px;font-size:28px;min-height:70px;display:flex;align-items:center;justify-content:center;text-align:center}
.mi.sel{border-color:var(--s);background:var(--soft)}
.mi.ok{border-color:var(--ok);background:var(--okbg)}
.mi .mb{font-size:46px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.pcard{border:4px solid var(--line);border-radius:22px;background:#fff;padding:10px 6px;text-align:center;font-size:20px;line-height:1.15}
.pcard .em{font-size:44px;display:block;margin-bottom:2px}
.pcard.sel{border-color:var(--s);background:#E7F1FF}
.pcard .tick{display:none}
.pcard.sel .tick{display:inline}
.pbtn{border:0;background:#fff;width:100%}
.setup{max-width:1100px;margin:0 auto;padding:16px}
.setup .card{margin-bottom:16px}
.stu{border:4px solid var(--line);border-radius:24px;padding:12px 16px;margin:12px 0;background:#fff}
.stu>summary{cursor:pointer;font-size:26px;font-weight:600;list-style:none;display:flex;align-items:center;gap:10px}
.stu>summary::-webkit-details-marker{display:none}
.nm{font:inherit;font-size:26px;padding:8px 14px;border-radius:16px;border:4px solid var(--line);width:240px;max-width:100%}
.seg button{border:4px solid var(--line);background:#fff;border-radius:16px;padding:6px 14px;font-size:20px}
.seg button.on{background:var(--gold);border-color:var(--gold);font-weight:600}
.cnt button{width:56px;height:56px;border-radius:50%;border:4px solid var(--line);background:#fff;font-size:26px;font-weight:600}
.cnt button.on{background:var(--gold);border-color:var(--gold)}
.err{background:var(--nobg);color:#3b2a8c;border-radius:16px;padding:10px 16px;margin:10px 0;font-size:20px}
.mini{font-size:17px}
.mini input{font:inherit;font-size:19px;padding:6px 10px;border:3px solid var(--line);border-radius:12px;width:180px}
.ovl{position:fixed;inset:0;background:rgba(20,20,70,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:#fff;border-radius:28px;padding:22px 26px;max-width:900px;width:100%;max-height:92%;overflow:auto;box-shadow:0 10px 0 rgba(20,20,80,.3)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:0;border-radius:14px;padding:8px 14px;font-size:18px;background:var(--soft)}
.tabs button.on{background:var(--gold);font-weight:600}
.dlg table{width:100%;border-collapse:collapse;font-size:17px}
.dlg td,.dlg th{border-bottom:2px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.list-btn{display:inline-block;margin:4px;border:0;background:var(--soft);border-radius:12px;padding:8px 12px;font-size:17px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:20px;padding:10px 22px;font-size:22px;z-index:60;animation:pop .25s}
@keyframes pop{from{transform:translate(-50%,16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.fall{position:fixed;top:-40px;font-size:34px;animation:fall 2.2s linear forwards;z-index:70;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.stu-card{border:4px solid var(--line);border-radius:24px;padding:14px 18px;background:#fff}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.pill{display:inline-block;border-radius:12px;padding:3px 10px;margin:2px;font-size:17px;background:var(--soft)}
.pill.g{background:var(--okbg)}.pill.p{background:var(--nobg)}
.welc{text-align:center}
.avrow{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin:14px 0}
.avrow div{font-size:24px;font-weight:600}
.pron-btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pron-btns button{border:4px solid var(--line);background:#fff;border-radius:16px;padding:6px 16px;font-size:26px;font-weight:600;color:var(--s)}
.pron-btns button.on{background:var(--s);color:#fff;border-color:var(--s)}
.pron-btns button.seen{border-color:var(--ok)}
.owner{font-size:17px;background:var(--soft);border-radius:12px;padding:2px 10px;display:inline-block;margin-right:8px}

.avpick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.av{border:4px solid var(--line);background:#fff;border-radius:18px;padding:4px 6px 0}
.av.on{border-color:var(--gold);background:#FFF3BF}
.brk .bk{position:relative;background:#fff;border-radius:30px;padding:20px 26px;max-width:620px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(20,20,80,.3)}
.bk-stage{height:270px;border-radius:24px;background:radial-gradient(circle at 50% 15%,#ffd6ff,#5b4bdc 72%);position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;margin-bottom:8px}
.bk-stage .disco{position:absolute;top:4px;left:50%;margin-left:-24px;font-size:48px;animation:spin 3s linear infinite}
.hero{font-size:150px;line-height:1;transform-origin:50% 100%}
.drop{animation:drop .9s cubic-bezier(.2,1.3,.4,1) both}
@keyframes drop{from{transform:translate(var(--from),-130%) rotate(360deg)}to{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.mv-dance{animation:dance .5s ease-in-out infinite alternate}
@keyframes dance{from{transform:rotate(-14deg) translateX(-30px)}to{transform:rotate(14deg) translateX(30px) translateY(-20px)}}
.mv-balance{animation:bal 2s ease-in-out infinite alternate}
@keyframes bal{from{transform:rotate(-9deg) translateY(0)}to{transform:rotate(9deg) translateY(-16px) skewX(8deg)}}
.mv-jump{animation:jmp .5s ease-in infinite alternate}
@keyframes jmp{from{transform:translateY(0) scaleY(.9)}to{transform:translateY(-100px)}}
.mv-robot{animation:rob .5s steps(2) infinite}
@keyframes rob{0%{transform:rotate(-12deg) scaleX(1)}50%{transform:rotate(12deg) scaleX(-1)}100%{transform:rotate(-12deg) scaleX(1)}}
.mv-spin{animation:sp 2s ease-in-out infinite}
@keyframes sp{0%{transform:rotate(0)}70%{transform:rotate(360deg)}100%{transform:rotate(360deg)}}
.bk-stage{gap:14px}
.coach{font-size:96px;animation:coachb .5s ease-in-out infinite alternate}
@keyframes coachb{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-18px) rotate(6deg)}}
#bkfig{display:flex;align-items:flex-end}
.dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:44px}
.bd{width:38px;height:38px;border-radius:50%;background:#EEF1FF;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600}
.bd.on{background:var(--gold);transform:scale(1.2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){body{font-size:18px}h1{font-size:34px}h2{font-size:28px}.ex li{font-size:26px}.opt{font-size:23px}.mgrid{gap:10px}}
</style>
</head>

<script>
/* ================= DATA ================= */

];
const FOODS=[['eggs','Eggs','🍳'],['toast','Bread and toast','🍞'],['cereal','Cereal','🥣'],['pancakes','Pancakes','🥞'],['sandwiches','Sandwiches','🥪'],['pizza','Pizza','🍕'],['pasta','Pasta','🍝'],['rice','Rice','🍚'],['chicken','Chicken','🍗'],['fish','Fish','🐟'],['soup','Soup','🍲'],['potatoes','Potatoes','🥔'],['apples','Apples','🍎'],['bananas','Bananas','🍌'],['strawberries','Strawberries','🍓'],['fruit','Other fruits','🍇'],['vegetables','Vegetables','🥕'],['yogurt','Yogurt','🥛'],['ice cream','Ice cream','🍨']].map(([n,l,e])=>({k:n,n,l,e}));

const MEALE={breakfast:'🌅',lunch:'☀️',dinner:'🌙'};
const mkAct=x=>({key:x.v+'|'+x.o,v:x.v,o:x.o,e:x.e,like:x.like||null});
const IA=INTERESTS.map(mkAct),RA=ROUTINE.map(mkAct);

const TOPICS={w:'Warm-up',t1:'Positive: I / you',t2:'Positive: he / she / it',t3:'Positive: we / they',t4:'Positive review',n1:"Negative: don't",n2:"Negative: doesn't",n3:'Negative review',q1:'Questions with Do',q2:'Questions with Does',q3:'Short answers',f:'Food sentences',m:'Mixed practice'};
const TOPIC_ORDER=['t1','t2','t3','t4','n1','n2','n3','q1','q2','q3','f','m'];

/* ================= RANDOM ================= */
let _s=1;
function seed(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}_s=h>>>0}
function rnd(){_s=(_s+0x6D2B79F5)>>>0;let t=_s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}
const pick=a=>a[Math.floor(rnd()*a.length)];
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* ================= GRAMMAR ================= */
const TH=p=>p==='he'||p==='she'||p==='it';
function v3(v){const parts=v.split(' ');const w=parts[0];let stem=w,suf='s';
 if(/[^aeiou]y$/.test(w)){stem=w.slice(0,-1);suf='ies'}else if(/(s|sh|ch|x|z|o)$/.test(w))suf='es';
 return{stem,suf,rest:parts.slice(1).join(' ')}}
function ing(v){const parts=v.split(' ');let w=parts[0];
 if(['swim','run','sit'].includes(w))w+=w.slice(-1);else if(/[^e]e$/.test(w))w=w.slice(0,-1);
 return[w+'ing'].concat(parts.slice(1)).join(' ')}
function chH(c){
 if(c.k==='v3')return`<b class="w-v">${esc(c.stem)}</b><b class="w-x">${esc(c.suf)}</b>`+(c.rest?` <b class="w-v">${esc(c.rest)}</b>`:'');
 return`<b class="w-${c.k}">${esc(c.t)}</b>`}
function mkS(p,form,a,name,bad){
 const th=TH(p);const subjT=name||(p==='I'?'I':p);
 const auxTh=bad==='aux'?!th:th;
 let useS=form==='pos'?th:false;if(bad==='verb')useS=!useS;
 let vc;
 if(bad==='ing'&&form==='pos')vc={k:'v',t:ing(a.v)};
 else if(useS){vc=Object.assign({k:'v3'},v3(a.v));vc.t=vc.stem+vc.suf+(vc.rest?' '+vc.rest:'')}

/* ================= RENDER ================= */
let scrollKeep=0;
function keep(){const m=$('#stage');scrollKeep=m?m.scrollTop:0;render(true)}
function render(k){const app=$('#app');
 if(ST.view==='setup'){const o=$('#setupMain'),y=o?o.scrollTop:0;app.innerHTML=setupHTML();const n2=$('#setupMain');if(n2)n2.scrollTop=y;return}
 const s=SL[ST.i];app.innerHTML=head(s)+`<main id="stage">${stageHTML(s)}</main>`+foot(s)+(ST.open?drawer():'');
 const m=$('#stage');if(m)m.scrollTop=k?scrollKeep:0;save()}
function head(s){const pct=Math.round((ST.i+1)/SL.length*100),r=ST.cfg.reward;
 const chips=P.map((p,i)=>`<span class="chip">${esc(p.name)} ${r} ${(ST.stats[i]||{stars:0}).stars}</span>`).join('');
 return`<header class="top"><button class="ib" data-a="home" title="Home">🏠</button><div class="prog"><small>Slide ${ST.i+1} of ${SL.length}</small><div class="bar"><i style="width:${pct}%"></i></div></div><div class="chips">${chips}${ST.chests?`<span class="chip">🎁 ${ST.chests}</span>`:''}</div><button class="ib" data-a="sound" title="Sound">${ST.sound?'🔊':'🔇'}</button><button class="ib" data-a="menu" title="Teacher menu">⚙️</button></header>`}
function foot(s){const locked=!isDone(s)&&!ST.free,last=ST.i===SL.length-1;
 const single=s.practice&&(s.t!=='choice'||s.items.length===1)&&P.length>1&&s.t!=='ask';
 const turn=single?`<div class="turn">Who is answering? ${P.map((p,i)=>`<button class="${ownerOf(s)===i?'on':''}" data-a="ov" data-i="${i}">${esc(p.name)}</button>`).join('')}</div>`:'<div></div>';
 return`<footer class="nav"><button class="btn" data-a="back" ${ST.i===0?'disabled':''}>◀ Back</button>${turn}<button class="btn ${locked?'':'pri'}" data-a="next" ${locked||last?'disabled':''}>${locked?'🔒 Answer first':'Next ▶'}</button></footer>`}
function ownTag(s){return P.length>1&&s.practice?`<span class="owner">${esc(P[ownerOf(s)].name)}'s turn</span>`:''}
function ttl(s){return`<h2>${ownTag(s)}${s.title||''}</h2>`}
function stageHTML(s){switch(s.t){
 case'welcome':return welcomeH();case'interests':return interestsH();case'teach':return teachH(s);case'pron':return pronH(s);
 case'choice':return choiceH(s);case'build':return buildH(s);case'match':return matchH(s);case'foodbuild':return foodbuildH(s);
 case'vocab':return vocabH(s);case'ask':return askH(s);case'summary':return summaryH();}return''}
function welcomeH(){const names=joinNames(P.map(p=>esc(p.name)));
 return`<div class="card welc"><h1>Hello, ${names}! 👋</h1><p style="font-size:26px">Let's go on a Present Simple adventure!</p><div class="avrow">${P.map((p,i)=>`<div>${kid(p.g,AV(i),'wave',130)}${esc(p.name)}</div>`).join('')}</div><button class="btn pri big2" data-a="next">Let's start!</button></div>`}
function interestsH(){return`<div class="card"><h2>Meet our interests</h2><div class="sgrid">${P.map((p,i)=>{const ac=actsOf(p).slice(0,4);const lk=ac.find(a=>a.like);
 return`<div class="stu-card"><div style="display:flex;gap:12px;align-items:center">${kid(p.g,AV(i),'self',80)}<h3>${esc(p.name)}</h3></div>${ac.map(a=>`<div style="font-size:28px;margin:6px 0">${a.e} ${mkS('I','pos',a,null).html}</div>`).join('')}${lk?`<div style="font-size:28px">❤️ ${mkS('I','pos',likeOf(lk),null).html}</div>`:''}</div>`}).join('')}</div><p class="instr">Tap 🔊 on the next slides to hear sentences. Blue = who, green = what we do!</p></div>`}
function teachH(s){
 const ex=(s.ex||[]).map(S=>`<li><button class="spk" data-a="say" data-t="${esc(S.plain)}" title="Listen">🔊</button><span>${S.html}</span></li>`).join('');
 const fm=s.formulas?`<div class="formula two2">${s.formulas.map(f=>`<div>${f}</div>`).join('')}</div>`:(s.formula?`<div class="formula">${s.formula}</div>`:'');
 const mo=s.morph?`<div class="morph"><div>${s.morph[0].html}</div><div class="arr">⬇</div><div>${s.morph[1].html}</div></div>`:'';
 return`<div class="card two"><div><h2>${s.title}</h2>${s.rule?`<p class="rule">${s.rule}</p>`:''}${fm}${mo}${s.table||''}<ul class="ex">${ex}</ul>${s.note?`<div class="note">${s.note}</div>`:''}${s.instr?`<div class="instr">👉 ${s.instr}</div>`:''}</div><div>${s.pic||''}</div></div>`}
function pronH(s){const c=RT.pr.cur,it=s.items[c];
 const btns=s.items.map((x,i)=>`<button class="${i===c?'on':''} ${RT.pr.seen[i]?'seen':''}" data-a="pp" data-i="${i}">${cap(x.p)}</button>`).join('');
 const all=Object.keys(RT.pr.seen).length===s.items.length;
 return`<div class="card two"><div><h2>${s.title}</h2><div class="pron-btns">${btns}</div><div class="formula" style="font-size:36px">${esc(it.desc)}</div><ul class="ex"><li><button class="spk" data-a="say" data-t="${esc(it.plain)}">🔊</button><span>${it.html}</span></li></ul>${it.p==='it'?'<div class="note">It can be an animal or a thing: it runs, it works.</div>':''}${it.p==='we'?'<div class="note">We includes ME. Look at the circle!</div>':''}${it.p==='they'?'<div class="note">They does NOT include me. It is two or more others.</div>':''}<div class="instr">${all?'✅ You met all seven! Go on.':'👉 Tap each pronoun to meet it.'}</div></div><div>${it.pic}</div></div>`}
function fbBox(r,it){return(r.msg?`<div class="fb ${r.msg.k}">${r.msg.t}</div>`:'')+(r.hint&&it.hint&&!r.done?`<div class="fb hint">💡 ${it.hint}</div>`:'')}
function itActs(it,r,ii){if(r.done)return'';return`<div class="acts">${it.hint&&!r.hint?`<button class="btn" data-a="hint" data-i="${ii}">💡 Hint</button>`:''}${it.say?`<button class="btn" data-a="said" data-i="${ii}">🎤 I said it!</button>`:''}${r.wrong>=2&&!it.personal?`<button class="btn" data-a="show" data-i="${ii}">Show me ✨</button>`:''}</div>`}
function optsH(it,r,ii){return it.opts.map((o,oi)=>{let c='opt';if(r.right===oi)c+=' ok';else if(r.soft.includes(oi))c+=' soft';return`<button class="${c}" data-a="opt" data-i="${ii}" data-o="${oi}" ${r.done?'disabled':''}>${esc(o)}</button>`}).join('')}
function choiceH(s){const sg=s.items.length===1;
 if(sg){const it=s.items[0],r=RT.items[0];
  return`<div class="card two"><div>${ttl(s)}<div style="font-size:34px;font-weight:500;margin:6px 0 10px">${it.prompt}</div>${optsH(it,r,0)}${fbBox(r,it)}${itActs(it,r,0)}</div><div>${it.pic||''}</div></div>`}
 return`<div class="card">${ttl(s)}${s.items.map((it,ii)=>{const r=RT.items[ii];return`<div class="row"><div class="prompt">${P.length>1?`<span class="owner">${N(ownerOf(s,it))}</span>`:''}${it.prompt}</div><div class="inl">${optsH(it,r,ii)}</div>${fbBox(r,it)}${itActs(it,r,ii)}</div>`}).join('')}</div>`}
function buildH(s){return`<div class="card two"><div>${ttl(s)}${s.given?`<p class="sub">Change this sentence:</p><div class="formula">${s.given}</div>`:'<p class="sub">Put the words in the right order.</p>'}${s.instr?`<div class="instr">👉 ${s.instr}</div>`:''}${buildBlock(s,RT.b,s)}</div><div>${s.pic}</div></div>`}
function matchH(s){const m=RT.m;
 const L=s.pairs.map((p,i)=>`<button class="mi ${m.sel===i?'sel':''} ${m.done[i]?'ok':''}" data-a="ml" data-i="${i}" ${m.done[i]?'disabled':''}>${p.l}</button>`).join('');
 const R=s.order.map(i=>`<button class="mi ${m.done[i]?'ok':''}" data-a="mr" data-i="${i}" ${m.done[i]?'disabled':''}>${esc(s.pairs[i].r)}</button>`).join('');
 return`<div class="card">${ttl(s)}<p class="sub">Tap a card on the left, then tap its match on the right.</p><div class="mgrid"><div style="display:grid;gap:12px">${L}</div><div style="display:grid;gap:12px">${R}</div></div>${m.msg?`<div class="fb ${m.msg.k}">${m.msg.t}</div>`:''}</div>`}
function foodbuildH(s){const f=RT.fb,ow=ownerOf(s),foods=foodsOf(P[ow]),meals=mealsOf(P[ow]);
 const chip=(a,v,txt,on)=>`<button class="pcard ${on?'sel':''}" style="padding:6px 14px;font-size:24px" data-a="${a}" data-v="${esc(v)}">${txt}</button>`;
 const subs=PRONS.map(p=>chip('fbS',p,cap(p),f.subj===p)).join(''),fs=foods.map(x=>chip('fbF',x.n,x.e+' '+esc(x.n),f.food&&f.food.n===x.n)).join(''),ms=meals.map(m=>chip('fbM',m,MEALE[m]+' '+m,f.meal===m)).join('');
 const sent=f.b?`<div style="margin-top:14px">${buildBlock(f.bo,f.b,s)}${f.b.done?`<div class="acts"><button class="btn pri" data-a="fbAgain">Make another sentence 🔁</button></div>`:''}</div>`:'<div class="instr">👉 Pick a subject, a food and a meal.</div>';
 return`<div class="card two"><div>${ttl(s)}<h3>1. Who?</h3><div class="tray">${subs}</div><h3>2. What food?</h3><div class="tray">${fs}</div><h3>3. Which meal?</h3><div class="tray">${ms}</div>${sent}</div><div>${f.bo?f.bo.pic:scene([pronChars('I',ow)[0]],'🍽️')}</div></div>`}
function vocabH(s){const fo=unionFoods();
 return`<div class="card"><h2>${s.title}</h2><p class="sub">Tap a card to hear the word.</p><div class="pgrid">${fo.map(f=>`<button class="pcard" data-a="say" data-t="${esc(f.n)}"><span class="em">${f.e}</span>${esc(f.l)}</button>`).join('')}</div><h3 style="margin-top:18px">Meals</h3><div class="pgrid">${MEALS.map(m=>`<button class="pcard" data-a="say" data-t="for ${m[0]}"><span class="em">${m[2]}</span>for <b class="w-o">${m[0]}</b></button>`).join('')}</div><div class="instr">👉 We say: I eat eggs <b>for breakfast</b>. I eat pizza <b>for lunch</b>. I eat chicken <b>for dinner</b>.</div></div>`}
function askH(s){const A=RT.ask,n=P.length,Q=A.q;
 const asker=A.asker<0?'🤖 Robo':esc(P[A.asker].name),chip=(a,i,t,on)=>`<button class="${on?'on':''}" data-a="${a}" data-i="${i}">${t}</button>`;
 const aks=(n>0?P.map((p,i)=>chip('askA',i,esc(p.name),A.asker===i)).join(''):'')+chip('askA',-1,'🤖 Robo',A.asker<0);
 const ans=P.map((p,i)=>chip('askR',i,esc(p.name),A.ans===i)).join('');
 const bubble=`<div class="bubble" style="font-size:34px">${Q.html}</div>`;
 return`<div class="card two"><div><h2>${s.title}</h2><div class="turn" style="color:var(--ink)">Asks: ${aks}</div><div class="turn" style="color:var(--ink)">Answers: ${ans}</div><p style="font-size:24px"><b>${asker}</b> asks <b>${esc(P[A.ans].name)}</b>:</p>${bubble}<div class="acts"><button class="btn" data-a="say" data-t="${esc(Q.plain)}">🔊 Hear it</button></div>
 ${A.answered?'':`<div class="acts" style="margin-top:14px"><button class="btn go big2" data-a="askAns" data-v="1">Yes, I do!</button><button class="btn big2" data-a="askAns" data-v="0">No, I don't!</button></div>`}
 ${A.msg?`<div class="fb ${A.msg.k}">${A.msg.t}</div><div class="acts"><button class="btn pri" data-a="askNext">Ask again 🔁</button></div>`:''}
 <div class="instr">👉 Ask out loud, then answer. Answered: ${A.count}/2</div></div><div>${scene([pronChars('you',A.ans)[0],A.asker<0?pet():kid(P[A.asker].g,AV(A.asker),'down',110)],Q.a.e,'')}</div></div>`}
function topicSummary(i){const st=ST.stats[i]||{topics:{},stars:0,ok:0,bad:0};
 const tried=TOPIC_ORDER.filter(t=>st.topics[t]&&st.topics[t].ok+st.topics[t].bad>0);
 const weak=tried.filter(t=>{const x=st.topics[t];return x.bad>x.ok||(x.bad>=2&&x.bad/(x.ok+x.bad)>=.4)});
 const strong=tried.filter(t=>!weak.includes(t));
 const none=TOPIC_ORDER.filter(t=>!tried.includes(t));return{st,tried,weak,strong,none}}
function sumCard(i,compact){const T=topicSummary(i),st=T.st,tot=st.ok+st.bad;
 const pill=(t,c)=>`<span class="pill ${c}">${TOPICS[t]}</span>`;
 return`<div class="stu-card"><div style="display:flex;gap:10px;align-items:center">${compact?'':kid(P[i].g,AV(i),'wave',70)}<h3>${esc(P[i].name)}</h3></div>
 <p>${ST.cfg.reward} ${st.stars} · ${tot?`${st.ok} correct answers, ${st.bad} tries to fix`:'No answers yet'}${st.help?` · ${st.help} with help`:''}</p>
 ${T.strong.length?`<p class="mini"><b>Practised well:</b> ${T.strong.map(t=>pill(t,'g')).join('')}</p>`:''}
 ${T.weak.length?`<p class="mini"><b>Needs more practice:</b> ${T.weak.map(t=>`<button class="list-btn" data-a="jumpTopic" data-t="${t}">${TOPICS[t]} ▶</button>`).join('')}</p>`:''}
 ${T.none.length&&tot?`<p class="mini"><b>Not tried yet:</b> ${T.none.map(t=>pill(t,'p')).join('')}</p>`:''}</div>`}
function summaryH(){const names=joinNames(P.map(p=>esc(p.name)));
 return`<div class="card welc"><h1>Fantastic work, ${names}! 🎉</h1><p style="font-size:24px">You practised Present Simple: positive, negative and questions.</p><div class="sgrid" style="text-align:left;margin-top:14px">${P.map((p,i)=>sumCard(i)).join('')}</div><p class="sub" style="margin-top:14px">This summary only shows answers that were really given. Repeat the patterns above to make them stronger!</p><div class="acts" style="justify-content:center"><button class="btn pri" data-a="restartLesson">Play again 🔁</button><button class="btn" data-a="newGroup">New group</button></div></div>`}

/* ================= SETUP ================= */
function pickCard(f,i,k,e,l,on){return`<button class="pcard ${on?'sel':''}" data-a="tg" data-f="${f}" data-i="${i}" data-k="${esc(k)}"><span class="em">${e}</span>${esc(l)} <span class="tick">✓</span></button>`}
function setupHTML(){const c=ST.cfg;
 const stus=c.students.slice(0,c.n).map((s,i)=>{const open=ST.os===i;
  const ok=s.name.trim()&&(s.interests.length||s.routine.length);
  return`<div class="stu"><button class="btn" style="width:100%;text-align:left;font-size:26px;background:#fff;box-shadow:none" data-a="os" data-i="${i}">${ok?'✅':'📝'} Student ${i+1}: ${esc(s.name.trim()||'(name needed)')} <span class="sub">· ${s.interests.length} interests, ${s.foods.length+s.customFoods.length} foods</span></button>${open?`<div style="padding-top:10px">
  <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><input class="nm" data-a="name" data-i="${i}" value="${esc(s.name)}" placeholder="Student ${i+1} name" maxlength="20" aria-label="Student name">
  <span class="seg">Avatar: <button class="${s.g==='boy'?'on':''}" data-a="g" data-i="${i}" data-v="boy">Boy</button><button class="${s.g==='girl'?'on':''}" data-a="g" data-i="${i}" data-v="girl">Girl</button></span>
  </div><div style="margin-top:10px"><b>Choose avatar:</b> <div class="avpick">${[0,1,2,3,4,5,6,7].map(v=>`<button class="av ${(s.av!==undefined?s.av:i)===v?'on':''}" data-a="av" data-i="${i}" data-v="${v}" aria-label="Avatar ${v+1}">${kid(s.g,v,'down',54)}</button>`).join('')}</div></div><div style="margin-top:8px">${i>0?`<button class="btn mini" data-a="copy1" data-i="${i}">Copy choices from Student 1</button>`:''}</div>
  ${GROUPS.map(([g,l])=>`<h3 style="margin-top:14px">${l}</h3><div class="pgrid">${INTERESTS.filter(x=>x.g===g).map(x=>pickCard('interests',i,x.k,x.e,x.l,s.interests.includes(x.k))).join('')}</div>`).join('')}
  <h3 style="margin-top:14px">Favourite foods</h3><div class="pgrid">${FOODS.map(x=>pickCard('foods',i,x.k,x.e,x.l,s.foods.includes(x.k))).join('')}${s.customFoods.map((x,j)=>`<button class="pcard sel" data-a="rmF" data-i="${i}" data-j="${j}"><span class="em">${x.e}</span>${esc(x.l)} <span class="tick">✓ remove</span></button>`).join('')}</div>
  <div class="mini" style="margin-top:8px">Add another food: <input id="cf${i}" placeholder="e.g. dumplings" maxlength="20"> <button class="btn mini" data-a="addF" data-i="${i}">Add</button></div>
  <h3 style="margin-top:14px">Meals to practise</h3><div class="pgrid">${MEALS.map(m=>pickCard('meals',i,m[0],m[2],m[1],s.meals.includes(m[0]))).join('')}</div>
  <h3 style="margin-top:14px">Daily routine <span class="sub">(optional)</span></h3><div class="pgrid">${ROUTINE.map(x=>pickCard('routine',i,x.k,x.e,x.l,s.routine.includes(x.k))).join('')}</div></div>`:''}</div>`}).join('');
 return`<main id="setupMain" style="overflow:auto;flex:1"><div class="setup"><div class="card"><h1>🧑‍🏫 Teacher setup</h1><p class="sub">Students don't see this screen. Choose who is playing and what they like. The whole lesson will use these choices.</p>
 <h3>How many students?</h3><div class="cnt" style="display:flex;gap:10px">${[1,2,3,4,5,6].map(n=>`<button class="${c.n===n?'on':''}" data-a="n" data-v="${n}">${n}</button>`).join('')}</div>
 <h3 style="margin-top:14px">Reward theme</h3><div class="seg">${['⭐','💎','🪙','🍪'].map(r=>`<button class="${c.reward===r?'on':''}" data-a="reward" data-v="${r}">${r}</button>`).join('')}</div></div>
 <div class="card"><h2>Students</h2>${stus}</div>
 ${ST.err.length?`<div class="err"><b>Almost ready:</b><br>${ST.err.map(esc).join('<br>')}</div>`:''}
 <div class="card"><div class="acts"><button class="btn pri big2" data-a="start">${ST.edit?'Save and continue lesson':'Start Lesson ▶'}</button>${ST.edit?'<button class="btn" data-a="cancelEdit">Cancel</button>':''}<button class="btn" data-a="saveSetup">💾 Save setup for next time</button><button class="btn" data-a="loadSetup">📂 Load saved setup</button></div></div></div></main>`}

/* ================= TEACHER DRAWER ================= */
function drawer(){const tabs=[['nav','Navigate'],['prog','Progress'],['mist','Mistakes'],['key','Answer key'],['sess','Lesson & profiles']];
 let b='';const s=SL[ST.i];
 if(ST.tab==='nav'){const secs=[];SL.forEach(x=>{if(!secs.some(y=>y.sec===x.sec))secs.push(x)});
  b=`<h3>Jump to a section</h3>${secs.map(x=>`<button class="list-btn" data-a="jump" data-i="${x.idx}">${esc(x.sec)}</button>`).join('')}
  <h3 style="margin-top:14px">This slide</h3><div class="acts"><button class="btn" data-a="restartAct">↺ Restart activity</button><button class="btn" data-a="skipAct">⏭ Skip activity</button></div>
  <h3 style="margin-top:14px">Navigation</h3><label style="font-size:20px"><input type="checkbox" data-a="free" ${ST.free?'checked':''}> Free navigation (Next is always unlocked)</label>`}
 if(ST.tab==='prog'){const pr=SL.filter(x=>x.practice),dn=pr.filter(x=>ST.prog[x.id]&&ST.prog[x.id].done).length;
  b=`<p>Practice activities finished: <b>${dn} of ${pr.length}</b> · Treasure chests: ${ST.chests}</p><div class="sgrid">${P.map((p,i)=>sumCard(i,true)).join('')}</div><p class="sub">Answers are credited to the student whose turn it was.</p>`}
 if(ST.tab==='mist'){b=ST.log.length?`<table><tr><th>Student</th><th>Slide</th><th>Question</th><th>Chose</th><th>Correct</th></tr>${ST.log.slice().reverse().slice(0,80).map(l=>`<tr><td>${esc(l.who)}</td><td>${l.n}</td><td>${esc(l.q)}</td><td>${esc(l.chose)}</td><td>${esc(l.right)}</td></tr>`).join('')}</table>`:'<p>No mistakes recorded yet.</p>'}
 if(ST.tab==='key'){const rows=[];SL.forEach(x=>{if(x.t==='choice')x.items.forEach(it=>rows.push([x.idx+1,strip(it.prompt),[].concat(it.ans).map(a=>it.opts[a]).join(' / ')]));
   else if(x.t==='build')rows.push([x.idx+1,(x.given?strip(x.given)+' → ':'')+x.title,x.key]);
   else if(x.t==='match')rows.push([x.idx+1,x.title,x.pairs.map(p=>strip(p.r)).join(', ')]);
   else if(x.t==='foodbuild')rows.push([x.idx+1,x.title,'Any subject + eat/eats + food + for + meal']);});
  b=`<table><tr><th>Slide</th><th>Question</th><th>Answer</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td><b>${esc(r[2])}</b></td></tr>`).join('')}</table>`}
 if(ST.tab==='sess'){b=`<div class="acts"><button class="btn" data-a="editProf">✏️ Edit names, interests and foods</button><button class="btn" data-a="restartLesson">↺ Restart lesson</button><button class="btn" data-a="newGroup">👥 New group</button><button class="btn" data-a="resetAll">🧹 Reset everything</button></div>
  <p class="sub">Edits keep your place in the lesson. Restart clears progress but keeps the profiles. Reset everything also clears the profiles.</p>
  <div class="acts"><button class="btn" data-a="saveSetup">💾 Save setup for next time</button><button class="btn" data-a="sound">${ST.sound?'🔊 Sound on':'🔇 Sound off'}</button></div>`}
 return`<div class="ovl"><div class="dlg"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">⚙️ Teacher menu</h2><button class="btn" data-a="close">Close ✕</button></div><div class="tabs" style="margin-top:10px">${tabs.map(t=>`<button class="${ST.tab===t[0]?'on':''}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>${b}</div></div>`}

/* ================= EVENTS ================= */
function go(i){ST.i=Math.max(0,Math.min(SL.length-1,i));initRT();ST.open=false;render()}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.a==='name'){ST.cfg.students[+t.dataset.i].name=t.value}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.tagName==='INPUT'&&t.type!=='checkbox')return;const a=t.dataset.a,d=t.dataset,I=+d.i;const s=SL[ST.i];
 const c=ST.cfg,sd=c.students[I];
 switch(a){
 case'n':c.n=+d.v;while(c.students.length<c.n)c.students.push(blankStu(c.students.length));if(ST.os>=c.n)ST.os=0;render();break;
 case'reward':c.reward=d.v;render();break;
 case'os':ST.os=ST.os===I?-1:I;render();break;
 case'g':sd.g=d.v;render();break;
 case'av':sd.av=+d.v;render();break;
 case'tg':{const arr=sd[d.f],k=d.k,j=arr.indexOf(k);if(j>=0)arr.splice(j,1);else arr.push(k);render();break}
 case'addF':{const v=($('#cf'+I).value||'').trim();if(v){sd.customFoods.push({k:'c_'+v,n:v.toLowerCase(),l:cap(v),e:'🍽️'});render()}break}
 case'rmF':sd.customFoods.splice(+d.j,1);render();break;
 case'copy1':{const f=c.students[0];['interests','foods','meals','routine'].forEach(k=>sd[k]=f[k].slice());sd.customFoods=f.customFoods.map(x=>Object.assign({},x));render();break}
 case'start':startLesson();break;
 case'cancelEdit':ST.view='lesson';ST.edit=false;render();break;
 case'saveSetup':try{localStorage.setItem(KEEP,JSON.stringify(c));toast('Setup saved on this device ✔')}catch(er){toast('Saving is not available here')}break;
 case'loadSetup':try{const v=JSON.parse(localStorage.getItem(KEEP)||'null');if(v&&v.students){ST.cfg=v;render();toast('Saved setup loaded')}else toast('No saved setup yet')}catch(er){toast('Loading is not available here')}break;
 /* lesson nav */
 case'next':goNext();break;
 case'back':go(ST.i-1);break;
 case'home':go(0);break;
 case'sound':ST.sound=!ST.sound;if(!ST.sound){try{speechSynthesis.cancel()}catch(e){}stopMusic()}render();break;
 case'menu':ST.open=true;ST.tab='nav';render();break;
 case'close':ST.open=false;render();break;
 case'tab':ST.tab=d.v;render();break;
 case'jump':go(I);break;
 case'jumpTopic':{const x=SL.find(y=>y.practice&&(y.topic===d.t||(y.items&&y.items.some(it=>it.topic===d.t))));if(x)go(x.idx);break}
 case'free':ST.free=t.checked;render();break;
 case'skipAct':markDone(s,true);go(ST.i+1);break;
 case'restartAct':delete ST.prog[s.id];delete ST.ov[s.id];initRT();render();break;
 case'editProf':ST.view='setup';ST.edit=true;ST.open=false;ST.err=[];render();break;
 case'restartLesson':ST.i=0;ST.prog={};ST.stats=[];ST.log=[];ST.ov={};ST.chests=0;ST.brk={};ST.unitDone={};ST.open=false;initRT();render();break;
 case'newGroup':ST.cfg=DEF();ST.cfg.students=ST.cfg.students.map((x,k)=>blankStu(k));ST.view='setup';ST.edit=false;ST.i=0;ST.prog={};ST.stats=[];ST.log=[];ST.ov={};ST.chests=0;ST.brk={};ST.unitDone={};ST.open=false;ST.err=[];ST.os=0;render();break;
 case'resetAll':resetAll();break;
 case'ov':ST.ov[s.id]=I;render();break;
 case'say':say(d.t);break;
 case'pp':RT.pr.cur=I;RT.pr.seen[I]=1;render();say(s.items[I].plain);break;
 /* choice */
 case'opt':pickOpt(I,+d.o);break;
 case'hint':RT.items[I].hint=true;keep();break;
 case'show':revealItem(I);break;
 case'said':{const r=RT.items[I];r.done=true;r.msg={k:'ok',t:'Great speaking! ⭐'};grant(ownerOf(s,s.items[I]),1);if(RT.items.every(x=>x.done))markDone(s);keep();break}
 /* build */
 case'card':{const bs=s.t==='foodbuild'?RT.fb.b:RT.b,bo=s.t==='foodbuild'?RT.fb.bo:s;bPlace(bo,bs,+d.id);keep();break}
 case'slot':{const bs=s.t==='foodbuild'?RT.fb.b:RT.b;if(!bs.done){bs.slots[+d.j]=null;bs.msg=null}keep();break}
 case'clr':{const bs=s.t==='foodbuild'?RT.fb.b:RT.b;bs.slots=bs.slots.map(()=>null);bs.msg=null;keep();break}
 case'bhint':{const bs=s.t==='foodbuild'?RT.fb.b:RT.b,bo=s.t==='foodbuild'?RT.fb.bo:s;bHint(bo,bs);break}
 case'chk':{const fb=s.t==='foodbuild';bCheck(s,fb?RT.fb.bo:s,fb?RT.fb.b:RT.b,()=>markDone(s));break}
 case'bshow':{const fb=s.t==='foodbuild';bReveal(s,fb?RT.fb.bo:s,fb?RT.fb.b:RT.b,()=>markDone(s));break}
 /* foodbuild */
 case'fbS':RT.fb.subj=d.v;fbMake();keep();break;
 case'fbF':RT.fb.food=foodsOf(P[ownerOf(s)]).find(x=>x.n===d.v);fbMake();keep();break;
 case'fbM':RT.fb.meal=d.v;fbMake();keep();break;
 case'fbAgain':RT.fb.subj=RT.fb.food=RT.fb.meal=null;RT.fb.b=RT.fb.bo=null;keep();break;
 /* match */
 case'ml':RT.m.sel=RT.m.sel===I?null:I;RT.m.msg=null;keep();break;
 case'mr':{const m=RT.m;if(m.sel===null){m.msg={k:'hint',t:'Tap a card on the left first.'};keep();break}
  const ow=ownerOf(s),it={topic:s.topic,prompt:s.title,key:strip(s.pairs[m.sel].r)};
  if(m.sel===I){m.done[I]=1;m.msg={k:'ok',t:praise()};result(s,it,ow,true,m.wrong===0);sfx.ok();
   if(Object.keys(m.done).length===s.pairs.length){m.fin=true;grant(ow,m.wrong===0?2:1);markDone(s)}}
  else{m.wrong++;m.msg={k:'no',t:'Almost! Try again. Look carefully.'};result(s,it,ow,false,false,strip(s.pairs[I].r));sfx.no()}
  m.sel=null;keep();break}
 /* ask */
 case'askA':RT.ask.asker=I;keep();break;
 case'askR':RT.ask.ans=I;askQ();keep();break;
 case'askAns':askAnswer(d.v==='1');break;
 case'askNext':{const A=RT.ask,n=P.length;A.k++;if(n>1){A.asker=A.ans;A.ans=(A.ans+1)%n}askQ();keep();break}
 }});
document.addEventListener('keydown',e=>{if(ST.view!=='lesson'||ST.open)return;if(e.target.tagName==='INPUT')return;
 if(e.key==='ArrowRight')goNext();if(e.key==='ArrowLeft')go(ST.i-1)});

/* ================= MOVEMENT BREAK ================= */
const HEROES=[['🦊','Rocky'],['🐼','Pandi'],['🤖','Robo'],['🦖','Dino'],['🐱','Luna'],['🦩','Flo']];
let MUS=null,NB=null;
function stopMusic(){if(MUS){clearInterval(MUS);MUS=null}}
const PROGS={pop:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],house:[[50,53,57],[58,62,65],[53,57,60],[48,52,55]],funk:[[52,55,59],[48,52,55],[45,48,52],[47,51,54]],latin:[[57,60,64],[50,53,57],[52,56,59],[57,60,64]],trap:[[45,48,52],[41,45,48],[43,47,50],[40,44,47]],chill:[[48,52,55],[45,48,52],[53,57,60],[55,59,62]]};
function startMusic(bpm,style){stopMusic();if(!ST.sound)return;
 try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume();
  if(!NB){NB=AC.createBuffer(1,Math.floor(AC.sampleRate*.3),AC.sampleRate);const dd=NB.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1}
  const step=60/bpm/4,prog=PROGS[style]||PROGS.pop,mf=m=>440*Math.pow(2,(m-69)/12);
  const tone=(f,t,d,ty,g)=>{const o=AC.createOscillator(),v=AC.createGain();o.type=ty;o.frequency.value=f;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+d+.02)};
  const kick=t=>{const o=AC.createOscillator(),v=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);v.gain.setValueAtTime(.4,t);v.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+.22)};
  const noise=(t,d,g,hp)=>{const s=AC.createBufferSource(),f=AC.createBiquadFilter(),v=AC.createGain();s.buffer=NB;f.type='highpass';f.frequency.value=hp;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(v);v.connect(AC.destination);s.start(t);s.stop(t+d+.02)};
  const SC={
   pop:(s,t,ch)=>{if(s%4===0)kick(t);if(s===4||s===12)noise(t,.12,.14,1500);if(s%2===1)noise(t,.04,.05,7000);if(s%4===0||s===10)tone(mf(ch[0]-12),t,step*3,'sawtooth',.07);if(s%2===0)tone(mf(ch[(s/2)%3]+12),t,step*1.6,'square',.02);if(s===14)tone(mf(ch[2]+24),t,.2,'triangle',.05)},
   house:(s,t,ch)=>{if(s%4===0)kick(t);if(s%4===2)noise(t,.09,.08,8000);if(s%2===1)tone(mf(ch[0]-12),t,step*1.5,'sawtooth',.07);if(s===3||s===11)ch.forEach(m=>tone(mf(m),t,.12,'square',.025))},
   funk:(s,t,ch)=>{if([0,3,6,10].includes(s))kick(t);if(s===4||s===12)noise(t,.15,.16,1200);if(s%2===0)noise(t,.03,.04,8000);if([0,3,6,10,14].includes(s))tone(mf(ch[s===6?2:0]-12),t,step*1.5,'sawtooth',.08);if([2,5,9,13].includes(s))ch.forEach(m=>tone(mf(m),t,.09,'square',.015))},
   latin:(s,t,ch)=>{if([0,3,6,10,12].includes(s))noise(t,.04,.1,3000);if(s===0||s===8)kick(t);if(s%4===2)tone(220,t,.12,'sine',.12);if(s===0||s===6||s===10)tone(mf(ch[0]-12),t,step*2,'triangle',.12);if(s%2===0)tone(mf(ch[(s/2)%3]+12),t,.15,'sine',.05)},
   trap:(s,t,ch)=>{if(s===0||s===10)tone(mf(ch[0]-24),t,step*5,'sine',.3);if(s===8)noise(t,.15,.16,1500);noise(t,.03,.04,8000);if(s>=12)noise(t+step/2,.02,.03,9000);if(s%4===0)tone(mf(ch[2]+12),t,.3,'sine',.04)},
   chill:(s,t,ch)=>{if(s===0||s===8)kick(t);if(s%4===2)noise(t,.05,.03,9000);if(s===0)ch.forEach(m=>tone(mf(m),t,step*14,'sine',.04));if(s%4===0)tone(mf(ch[(s/4)%3]+12),t,.4,'triangle',.04)}};
  const fn=SC[style]||SC.pop;let n=0,next=AC.currentTime+.1;
  MUS=setInterval(()=>{while(next<AC.currentTime+.3){fn(n%16,next,prog[Math.floor(n/16)%4]);next+=step;n++}},80)}catch(e){}}

/* ---- figure that shows the pose ---- */
const B0={la:-12,lf:-12,ra:12,rf:12,lt:-8,ls:-8,rt:8,rs:8,dy:0,tilt:0,tx:0,sx:1,y:0};
const PZ={base:{},rUp:{rt:48,rs:12},lUp:{lt:-48,ls:-12},clap:{la:-40,lf:100,ra:40,rf:-100},open:{la:-70,lf:-100,ra:70,rf:100},
 up:{la:-165,lf:-170,ra:165,rf:170},star:{la:-140,lf:-150,ra:140,rf:150,lt:-25,ls:-25,rt:25,rs:25},
 jump:{la:-165,lf:-170,ra:165,rf:170,y:-28,lt:-5,ls:-5,rt:5,rs:5},squat:{dy:20,lt:-52,ls:-8,rt:52,rs:8},
 toes:{dy:20,lt:-52,ls:-8,rt:52,rs:8,la:-25,lf:-12,ra:25,rf:12},
 bendR:{tilt:22,ra:150,rf:165,la:-35,lf:25},bendL:{tilt:-22,la:-150,lf:-165,ra:35,rf:-25},out:{la:-90,lf:-90,ra:90,rf:90},
 roboA:{la:-90,lf:-180,ra:90,rf:0},roboB:{la:-90,lf:0,ra:90,rf:180},trex1:{la:-30,lf:35,ra:30,rf:-35},trex2:{la:-30,lf:75,ra:30,rf:-75},
 hipsR:{tx:16,tilt:-6,la:-35,lf:25,ra:35,rf:-25},hipsL:{tx:-16,tilt:6,la:-35,lf:25,ra:35,rf:-25},
 oneR:{rt:60,rs:-20,la:-90,lf:-90,ra:90,rf:90},oneL:{lt:-60,ls:20,la:-90,lf:-90,ra:90,rf:90},
 stepR:{rt:32,rs:32,tx:12},stepL:{lt:-32,ls:-32,tx:-12},turn:{sx:.25}};
function fig(pz){const o=Object.assign({},B0,pz),rad=a=>a*Math.PI/180,f1=n=>n.toFixed(1);
 const pt=(x,y,a,L)=>[x+L*Math.sin(rad(a)),y+L*Math.cos(rad(a))],hy=104+o.dy,sy=62+o.dy;
 const leg=(t,s)=>{const k=pt(60,hy,t,30),f=pt(k[0],k[1],s,30);return`<path d="M60 ${hy}L${f1(k[0])} ${f1(k[1])}L${f1(f[0])} ${f1(f[1])}" stroke="#364FC7" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="${f1(f[0])}" cy="${f1(f[1]+3)}" rx="9" ry="5" fill="#1B1F4B"/>`};
 const arm=(x0,u,f)=>{const e=pt(x0,sy,u,30),h=pt(e[0],e[1],f,28);return`<path d="M${x0} ${sy}L${f1(e[0])} ${f1(e[1])}L${f1(h[0])} ${f1(h[1])}" stroke="#F1C27D" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${f1(h[0])}" cy="${f1(h[1])}" r="6" fill="#F1C27D"/>`};
 const hd=34+o.dy;
 return`<svg viewBox="0 0 120 180" width="190" height="250" aria-hidden="true"><ellipse cx="60" cy="172" rx="40" ry="5" fill="rgba(0,0,0,.2)"/><g transform="translate(${o.tx} ${o.y}) translate(60 0) scale(${o.sx} 1) translate(-60 0)">${leg(o.lt,o.ls)}${leg(o.rt,o.rs)}<g transform="rotate(${o.tilt} 60 ${hy})"><path d="M60 ${sy-2}L60 ${hy-4}" stroke="#7A4DE8" stroke-width="32" stroke-linecap="round"/>${arm(48,o.la,o.lf)}${arm(72,o.ra,o.rf)}<circle cx="60" cy="${hd}" r="20" fill="#F1C27D"/><path d="M40 ${hd-2}A20 20 0 0 1 80 ${hd-2}Q60 ${hd-14} 40 ${hd-2}Z" fill="#2b1b10"/><circle cx="52" cy="${hd+2}" r="2.8" fill="#1B1F4B"/><circle cx="68" cy="${hd+2}" r="2.8" fill="#1B1F4B"/><path d="M52 ${hd+10}Q60 ${hd+17} 68 ${hd+10}" stroke="#1B1F4B" stroke-width="3" fill="none" stroke-linecap="round"/></g></g></svg>`}

/* ---- routines (original, one per hero) ---- */
const R_=t=>`<b class="w-s">${t}</b>`,L_=t=>`<b class="w-a">${t}</b>`;
function routineFor(i){const S=(t,seq,beats)=>({t,seq:seq.map(k=>PZ[k]),beats});
 switch(i%6){
 case 0:return{name:'Stomp & Clap',style:'pop',bpm:112,k:1,steps:[S(`Stomp your ${R_('RIGHT')} foot ×2`,['rUp','base'],4),S(`Stomp your ${L_('LEFT')} foot ×2`,['lUp','base'],4),S('Clap clap clap clap! 👏',['clap','open'],8),S(`${R_('Right')}, ${R_('right')}, ${L_('left')}, ${L_('left')}!`,['rUp','base','rUp','base','lUp','base','lUp','base'],8),S('Jump! Hands up! ⬆️',['jump','base'],4),S('Freeze like a star ⭐',['star'],4)]};
 case 1:return{name:'Stretch & Reach',style:'chill',bpm:90,k:1,steps:[S('Reach UP high ✋',['up','base'],4),S('Touch your toes 🦶',['toes','base'],4),S(`Bend ${R_('RIGHT')} ➡️`,['bendR','base'],4),S(`Bend ${L_('LEFT')} ⬅️`,['bendL','base'],4),S('Big arm circles ⭕',['out','up'],8),S('Deep breath: arms up… and down',['up','base'],4)]};
 case 2:return{name:'Robot Dance',style:'house',bpm:120,k:1,steps:[S('Robot arms! 🤖',['roboA','roboB'],8),S('Robot steps: stomp, stomp',['stepR','stepL'],8),S('Beep beep: arms up, arms down',['up','base'],4),S('Robot jump!',['jump','base'],4),S('Power off: freeze! ⏸️',['out'],4)]};
 case 3:return{name:'Dino Stomp',style:'funk',bpm:108,k:1,steps:[S('Tiny T-rex arms 🦖',['trex1','trex2'],8),S('Big dino stomps!',['rUp','base','lUp','base'],8),S('Wiggle your tail!',['hipsR','hipsL'],8),S('ROAR and jump! 🦖',['jump','base'],4)]};
 case 4:{const st=[S('Get ready: arms out like a cat 🐱',['out'],4)];
  P.forEach((p,j)=>st.push(S(`<b>${esc(p.name)}</b>: ONE leg! Hold…${P.length>1?'<div style="font-size:20px;font-weight:400">Everyone else: clap the beat 👏</div>':''}`,[j%2?'oneL':'oneR'],8)));
  st.push(S('Everyone: land softly and bow 🙇',['squat','base'],4));return{name:'Cat Balance',style:'latin',bpm:100,k:1,steps:st}}
 default:return{name:'Hip & Step',style:'trap',bpm:140,k:2,steps:[S(`Step ${R_('RIGHT')}, step ${L_('LEFT')}`,['stepR','stepL'],8),S(`Hips ${R_('right')}, ${L_('left')}`,['hipsR','hipsL'],8),S('Turn around! 🔄',['base','turn'],4),S('Clap! 👏',['clap','open'],4),S('Pose! ⭐',['star'],4)]}}}

function goNext(){const s=SL[ST.i];if(!(isDone(s)||ST.free))return;
 if(ST.i%10===9&&!ST.brk[ST.i]&&ST.i<SL.length-2){ST.brk[ST.i]=1;save();startBreak(ST.i+1)}else go(ST.i+1)}
function startBreak(next){
 const hi=ST.hero%HEROES.length,hero=HEROES[hi];ST.hero++;save();
 const R=routineFor(hi),beatMs=60/R.bpm*R.k*1000,side=Math.random()<.5?'-60vw':'60vw';
 const total=R.steps.reduce((a,s)=>a+s.beats,0);
 const d=document.createElement('div');d.id='brk';d.className='ovl brk';document.body.appendChild(d);
 let tm=null;
 const close=()=>{clearInterval(tm);stopMusic();d.remove();go(next)};
 const mute=()=>`<button class="ib" id="bkm" style="background:#EEF1FF;color:#1B1F4B;position:absolute;top:10px;right:10px">${ST.sound?'🔊':'🔇'}</button>`;
 const bindMute=()=>{const b=d.querySelector('#bkm');if(b)b.onclick=()=>{ST.sound=!ST.sound;if(ST.sound)startMusic(R.bpm,R.style);else stopMusic();b.textContent=ST.sound?'🔊':'🔇';save()}};
 const intro=()=>{d.innerHTML=`<div class="bk">${mute()}<div class="bk-stage"><div class="disco">🪩</div><div class="hero drop" style="--from:${side}">${hero[0]}</div></div><h2>🎵 Movement break!</h2><p style="font-size:24px">Hi! I'm <b>${hero[1]}</b>. Today: <b>${R.name}</b>.<br>Copy my moves! Mirror me 🪞</p><div class="acts" style="justify-content:center"><button class="btn pri big2" id="bkgo">Let's move! 🎶</button><button class="btn" id="bkskip">Skip</button></div></div>`;
  d.querySelector('#bkgo').onclick=play;d.querySelector('#bkskip').onclick=close;bindMute()};
 const play=()=>{
  d.innerHTML=`<div class="bk">${mute()}<div class="bk-stage"><div class="disco">🪩</div><div class="hero coach" style="animation-duration:${(beatMs/1000).toFixed(2)}s">${hero[0]}</div><div id="bkfig"></div></div><div class="sub" id="bkn"></div><h2 id="bkt" style="min-height:70px"></h2><div class="dots" id="bkd"></div><div class="bar" style="background:#E3E8FF;margin-top:8px"><i id="bkbar" style="width:0;background:#7A4DE8"></i></div><div class="acts" style="justify-content:center"><button class="btn" id="bkskip">Skip</button></div></div>`;
  d.querySelector('#bkskip').onclick=close;bindMute();startMusic(R.bpm,R.style);
  let si=0,bi=0,done=0;const fg=d.querySelector('#bkfig');
  const showStep=()=>{const s=R.steps[si];d.querySelector('#bkn').textContent=`Move ${si+1} of ${R.steps.length}`;d.querySelector('#bkt').innerHTML=s.t;
   d.querySelector('#bkd').innerHTML=Array.from({length:s.beats},(_,k)=>`<b class="bd" data-k="${k}">${k+1}</b>`).join('')};
  const tick=()=>{const s=R.steps[si];fg.innerHTML=fig(s.seq[bi%s.seq.length]);
   d.querySelectorAll('.bd').forEach((e,k)=>e.classList.toggle('on',k===bi));
   d.querySelector('#bkbar').style.width=Math.min(100,(done+bi+1)/total*100)+'%';
   bi++;if(bi>=s.beats){done+=s.beats;bi=0;si++;if(si>=R.steps.length){clearInterval(tm);setTimeout(()=>{stopMusic();outro()},beatMs);return}showStep()}};
  showStep();tick();tm=setInterval(tick,beatMs)};
 const outro=()=>{confetti();sfx.win();d.innerHTML=`<div class="bk"><div class="bk-stage"><div class="hero mv-jump" style="animation-duration:.5s">${hero[0]}</div></div><h2>Great moving! ⭐</h2><p style="font-size:24px">Now back to English!</p><button class="btn pri big2" id="bkgo">Continue ▶</button></div>`;d.querySelector('#bkgo').onclick=close};
 intro()}

/* ================= BOOT ================= */
load();
if(ST.view==='lesson'){try{applyCfg();buildSlides();ST.i=Math.min(ST.i,SL.length-1);initRT()}catch(e){ST.view='setup'}}
render();

</script>
